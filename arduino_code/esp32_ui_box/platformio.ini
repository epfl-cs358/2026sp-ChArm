[platformio]
src_dir = .

[env:esp32_ui_box]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
upload_speed = 115200
monitor_port = /dev/cu.usbserial-1140
upload_port = /dev/cu.usbserial-1140
monitor_filters = direct
monitor_echo = yes
monitor_eol = LF
lib_deps =
    Arduino-Libraries/LiquidCrystal
build_src_filter =
    +<esp32_ui_box.cpp>
    +<uiController_esp32.cpp>
    +<../src/hardware/src/buttonInput.cpp>
    +<../src/hardware/src/uiState.cpp>
    +<../src/hardware/src/lcdDisplay.cpp>
